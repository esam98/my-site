<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصتي الرقمية الحصرية</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #0f1015; color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { width: 100%; max-width: 900px; padding: 20px; }
        
        /* شاشة تسجيل الدخول */
        #login-box { background: #181920; padding: 35px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); text-align: center; max-width: 450px; margin: auto; border: 1px solid #2a2b36; }
        #login-box h2 { margin-bottom: 10px; color: #f1f1f1; font-size: 22px; }
        #login-box p { color: #8c92a4; font-size: 14px; margin-bottom: 20px; }
        input[type="text"] { width: 100%; padding: 14px; margin-bottom: 20px; border: 1px solid #353849; border-radius: 8px; background: #121318; color: #fff; font-size: 16px; outline: none; transition: 0.3s; }
        input[type="text"]:focus { border-color: #007bff; }
        button { padding: 14px 25px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; transition: 0.3s; }
        button:hover { background: #0056b3; }
        button:disabled { background: #444; cursor: not-allowed; }
        .msg { margin-top: 15px; font-size: 14px; }
        .error { color: #ff4d4d; }
        .success { color: #ffc107; font-weight: bold; }

        /* واجهة عرض المحتوى والمجلدات */
        #app-content { display: none; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #2a2b36; padding-bottom: 15px; }
        .header h1 { font-size: 20px; color: #007bff; }
        .logout-btn { background: #dc3545; width: auto; padding: 8px 15px; font-size: 13px; }
        .logout-btn:hover { background: #b02a37; }

        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .card { background: #181920; border: 1px solid #2a2b36; border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; transition: transform 0.2s, background 0.2s, border-color 0.2s; }
        .card:hover { transform: translateY(-4px); background: #20222b; border-color: #007bff; }
        .card-icon { font-size: 40px; margin-bottom: 10px; }
        .card-title { font-size: 15px; font-weight: 600; color: #e1e1e6; word-break: break-all; }

        /* مشغل الفيديو */
        #player-container { display: none; text-align: center; background: #181920; padding: 20px; border-radius: 16px; border: 1px solid #2a2b36; }
        video { width: 100%; max-height: 450px; border-radius: 10px; outline: none; background: #000; margin-bottom: 15px; }
        .back-btn { background: #6c757d; width: auto; display: inline-block; }
        .back-btn:hover { background: #5a6268; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="container">
        <div id="login-box">
            <h2>تسجيل الدخول للمنصة</h2>
            <p>أدخل الكود الخاص لجهازك للمتابعة:</p>
            <input type="text" id="code-input" placeholder="اكتب الكود هنا...">
            <button id="login-btn" onclick="verifyCode()">دخول</button>
            <div id="msg" class="msg"></div>
        </div>

        <div id="app-content">
            <div class="header">
                <h1 id="path-title">📁 الملفات الرئيسية</h1>
                <button class="logout-btn" onclick="logout()">خروج</button>
            </div>
            <div id="items-grid" class="grid-container">
                </div>
        </div>

        <div id="player-container">
            <h2 id="video-title" style="margin-bottom: 15px; font-size: 18px;">مشاهدة الفيديو</h2>
            <video id="main-video" controls controlsList="nodownload" oncontextmenu="return false;">
                <source id="video-source" src="" type="video/mp4">
                متصفحك لا يدعم عرض الفيديو.
            </video>
            <br>
            <button class="back-btn" onclick="goBack()">رجوع للقائمة</button>
        </div>
    </div>

    <script>
        // رابط جوجل Apps Script الخاص بك
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwgjvHsbhPbpbtRyrFq1mpqKU3tgneQR2kyWyyXXdkjOZ2cyhLb_L8AJMdYVk8AnzqMUg/exec";

        // تم ربط الحساب والمستودع الخاص بك هنا
        const GITHUB_USER = "esam98";
        const GITHUB_REPO = "my-site";
        
        let currentPath = ""; 

        window.onload = function() {
            if (sessionStorage.getItem("device_logged_in") === "true") {
                showApp();
            }
        };

        function getDeviceId() {
            let deviceId = localStorage.getItem('unique_device_id');
            if (!deviceId) {
                deviceId = 'dev_' + Math.random().toString(36).substring(2) + Date.now().toString(36);
                localStorage.setItem('unique_device_id', deviceId);
            }
            return deviceId;
        }

        async function verifyCode() {
            const code = document.getElementById('code-input').value.trim();
            const msg = document.getElementById('msg');
            const loginBtn = document.getElementById('login-btn');
            
            if (!code) {
                msg.className = "msg error";
                msg.textContent = "الرجاء إدخال الكود.";
                return;
            }

            msg.className = "msg success";
            msg.textContent = "⏳ جاري التحقق وتسجيل الدخول...";
            loginBtn.disabled = true;

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: "POST",
                    body: JSON.stringify({ code: code, deviceId: getDeviceId() })
                });
                const result = await response.json();

                if (result.status === "success") {
                    sessionStorage.setItem("device_logged_in", "true");
                    showApp();
                } else {
                    msg.className = "msg error";
                    msg.textContent = result.message;
                    loginBtn.disabled = false;
                }
            } catch (error) {
                msg.className = "msg error";
                msg.textContent = "حدث خطأ في الاتصال، حاول مرة أخرى.";
                loginBtn.disabled = false;
            }
        }

        function showApp() {
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('app-content').style.display = "block";
            loadFolderContent("");
        }

        function logout() {
            sessionStorage.removeItem("device_logged_in");
            location.reload();
        }

        async function loadFolderContent(path) {
            currentPath = path;
            const grid = document.getElementById('items-grid');
            const pathTitle = document.getElementById('path-title');
            
            grid.innerHTML = "<p style='color:#8c92a4; grid-column: 1/-1; text-align:center;'>جاري جلب الملفات...</p>";
            pathTitle.textContent = path === "" ? "📁 الملفات الرئيسية" : `📁 / ${path}`;

            try {
                const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${path}`;
                const res = await fetch(apiUrl);
                const items = await res.json();

                grid.innerHTML = "";

                if (path !== "") {
                    let parentPath = path.substring(0, path.lastIndexOf('/'));
                    let backCard = document.createElement('div');
                    backCard.className = "card";
                    backCard.innerHTML = `<div class="card-icon">🔙</div><div class="card-title">رجوع للخلف</div>`;
                    backCard.onclick = () => loadFolderContent(parentPath);
                    grid.appendChild(backCard);
                }

                if (!Array.isArray(items) || items.length === 0) {
                    if (path === "") {
                        grid.innerHTML = "<p style='color:#8c92a4; grid-column: 1/-1; text-align:center;'>المستودع فارغ حالياً. ارفع مجلدات أو فيديوهات!</p>";
                    }
                    return;
                }

                items.forEach(item => {
                    if (item.name === "index.html") return;

                    let card = document.createElement('div');
                    card.className = "card";

                    if (item.type === "dir") {
                        card.innerHTML = `<div class="card-icon">📁</div><div class="card-title">${item.name}</div>`;
                        card.onclick = () => loadFolderContent(item.path);
                    } else if (item.type === "file") {
                        let ext = item.name.split('.').pop().toLowerCase();
                        let icon = "📄";
                        if (['mp4', 'mkv', 'webm', 'mov'].includes(ext)) icon = "🎬";
                        else if (['jpg', 'jpeg', 'png', 'gif'].includes(ext)) icon = "🖼️";
                        
                        card.innerHTML = `<div class="card-icon">${icon}</div><div class="card-title">${item.name}</div>`;
                        
                        if (['mp4', 'mkv', 'webm', 'mov'].includes(ext)) {
                            card.onclick = () => playVideo(item.name, item.download_url);
                        } else {
                            card.onclick = () => window.open(item.download_url, '_blank');
                        }
                    }
                    grid.appendChild(card);
                });

            } catch (err) {
                grid.innerHTML = "<p style='color:#ff4d4d; grid-column: 1/-1; text-align:center;'>فشل في جلب الملفات. تأكد من إعدادات المستودع.</p>";
            }
        }

        function playVideo(title, url) {
            document.getElementById('app-content').style.display = "none";
            document.getElementById('player-container').style.display = "block";
            document.getElementById('video-title').textContent = title;
            
            let videoSource = document.getElementById('video-source');
            videoSource.src = url;
            let videoElement = document.getElementById('main-video');
            videoElement.load();
        }

        function goBack() {
            let videoElement = document.getElementById('main-video');
            videoElement.pause();
            document.getElementById('player-container').style.display = "none";
            document.getElementById('app-content').style.display = "block";
            loadFolderContent(currentPath);
        }
    </script>

</body>
</html>
